name: Ultimate Capacitor Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Ekstrak file ZIP proyek kasir
      - name: Unzip Project File
        run: |
          unzip kasir-ta-apk-project.zip -d ./extracted_project

      # 2. Cari otomatis lokasi package.json
      - name: Locate Project Root
        id: locate
        run: |
          TARGET_DIR=$(find ./extracted_project -name "package.json" -exec dirname {} \; | head -n 1)
          echo "project_path=$TARGET_DIR" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd ${{ steps.locate.outputs.project_path }}
          npm install

      - name: Build Web Project
        run: |
          cd ${{ steps.locate.outputs.project_path }}
          npm run build --if-present

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Hapus folder android lama (jika ada) dan buat baru yang bersih agar tidak bentrok
      - name: Generate Fresh Capacitor Android Platform
        run: |
          cd ${{ steps.locate.outputs.project_path }}
          rm -rf android
          npx cap add android
          npx cap sync android

      # 4. Jalankan kompilasi Gradle dari folder Android yang baru dibuat
      - name: Build Debug APK via Gradle
        run: |
          cd ${{ steps.locate.outputs.project_path }}/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. Unggah Hasil File APK Akhir
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Kasir-Siap-Instal
          path: |
            **/build/outputs/apk/debug/*.apk
