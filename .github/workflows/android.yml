name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Ikon dan splash screen (jika ada assets/icon-only.png)
        run: |
          if [ -f assets/icon-only.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#000308' --splashBackgroundColor '#000308' || echo "Ikon dilewati"
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kasir-ta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
