:root{--bg:#F3F6F4;--surface:#fff;--ink:#0F1E19;--mute:#64736C;--line:#E2E9E5;--brand:#0FA574;--brand-d:#08795A;--onb:#fff;--soft:#E5F6EE;--amber:#FFB43B;--good:#08795A;--danger:#E5484D;--dk:#0F1E19;--ondk:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1512;--surface:#141F1B;--ink:#E9F4EF;--mute:#93A69D;--line:#24342E;--brand:#2FD39B;--brand-d:#6BE5BC;--onb:#06130E;--soft:#1B2D26;--amber:#FFC66B;--good:#4BE0AC;--danger:#FF7A80;--dk:#E9F4EF;--ondk:#0C1512;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1512;--surface:#141F1B;--ink:#E9F4EF;--mute:#93A69D;--line:#24342E;--brand:#2FD39B;--brand-d:#6BE5BC;--onb:#06130E;--soft:#1B2D26;--amber:#FFC66B;--good:#4BE0AC;--danger:#FF7A80;--dk:#E9F4EF;--ondk:#0C1512;color-scheme:dark}
html,body,#root{height:100%}
html{height:100vh;height:100dvh}
/* background-attachment:fixed dihapus: di WebView Android ini membuat seluruh layar di-repaint setiap scroll (penyebab utama lag) */
body{margin:0;color:var(--ink);font-family:Inter,system-ui,sans-serif;background:radial-gradient(640px 280px at 50% -90px,var(--soft),transparent 72%) no-repeat,var(--bg);-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* touch-action:manipulation menghilangkan jeda ketuk (double-tap zoom) sehingga tombol langsung merespons */
button,label,input,select,a{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
h1,h2,.hd{font-family:Sora,Inter,sans-serif;letter-spacing:-.015em}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.card{background:var(--surface);border-radius:20px;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(15,30,25,.04),0 14px 26px -18px rgba(15,30,25,.16)}
.btn{background:var(--brand);color:var(--onb);border-radius:14px;font-weight:700;padding:.85rem 1.1rem;border:0;box-shadow:0 8px 16px -8px var(--brand);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn2{background:var(--soft);color:var(--brand-d);border-radius:12px;font-weight:600;padding:.55rem .9rem;border:0}
.btn2:active{filter:brightness(.96)}
.chip{border:0;border-radius:999px;padding:.5rem 1rem;font-size:.85rem;font-weight:600;background:var(--surface);color:var(--mute);white-space:nowrap;box-shadow:0 0 0 1px var(--line);transition:background .15s,color .15s}
.chip.on{background:var(--dk);color:var(--ondk);box-shadow:none}
.inp{width:100%;border-radius:14px;padding:.75rem .95rem;font-size:.9rem;background:var(--surface);border:0;box-shadow:0 0 0 1px var(--line);color:var(--ink);transition:box-shadow .15s}
.inp:focus{outline:0;box-shadow:0 0 0 2px var(--brand)}
.inp::placeholder{color:var(--mute);opacity:.75}
.nums{font-variant-numeric:tabular-nums}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
@media (max-width:359px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.modal-card{max-height:calc(100vh - 2rem);max-height:calc(100dvh - 2rem);overflow-y:auto;-webkit-overflow-scrolling:touch}
.struk-scroll{max-height:calc(100vh - 12rem);max-height:calc(100dvh - 12rem);overflow:auto}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@keyframes shine{to{background-position:-300% 0}}
@keyframes cr-pulse{50%{transform:scaleX(2.1);opacity:.5}}
@keyframes cr-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cr{animation:cr-in .8s ease-out both}
.cr-sub{font-size:10px;letter-spacing:.2em;color:var(--mute)}
.cr-name{background:linear-gradient(90deg,#08795A,#0FA574,#2BCB95,#08795A);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.cr-line{height:2px;width:36px;margin:7px auto;border-radius:2px;background:linear-gradient(90deg,transparent,#0FA574,transparent);animation:cr-pulse 2.6s ease-in-out infinite}
.cr-copy{font-size:10px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.cr,.cr-name,.cr-line{animation:none}}
@keyframes ld{from{width:0}to{width:100%}}
@keyframes sp-in{0%{opacity:0;letter-spacing:.42em;filter:blur(14px);transform:scale(.94)}60%{opacity:1;filter:blur(0)}100%{opacity:1;letter-spacing:.07em;filter:blur(0);transform:none}}
@keyframes sp-flow{to{background-position:-250% 0}}
@keyframes sp-float{50%{transform:translate(18px,-14px) scale(1.08)}}
.sp-title{font-family:Sora,Inter,sans-serif;font-weight:800;line-height:1;white-space:nowrap;font-size:clamp(2.7rem,14vw,4.6rem);font-style:italic;background:linear-gradient(100deg,#00855C 0%,#00B87C 18%,#17E0A8 36%,#18C6F2 56%,#6BE36A 76%,#00B87C 90%,#00855C 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sp-in 1.2s cubic-bezier(.2,.8,.2,1) both,sp-flow 3.2s linear .6s infinite;padding:.08em .04em}
.sp-glow{filter:drop-shadow(0 12px 26px rgba(15,165,116,.38))}
.sp-blob{position:absolute;border-radius:9999px;filter:blur(64px);animation:sp-float 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sp-title,.sp-blob{animation:none}}
@media print{html,body,#root{height:auto!important;overflow:visible!important}body *{visibility:hidden}#struk,#struk *{visibility:visible}#struk{position:absolute;left:0;top:0;width:100%;max-height:none!important;overflow:visible!important}}

let LOGO='';
const Mark=({size,glass})=>LOGO?html`<img src=${LOGO} alt="Logo KASIR TA" className=${size+' shrink-0 rounded-xl object-contain'} />`:html`<div className=${size+' shrink-0 rounded-xl grid place-items-center font-extrabold hd'} style=${Object.assign({fontSize:(parseInt(size.match(/w-(\d+)/)[1])*0.1)+'rem'},glass?{background:'rgba(255,255,255,.18)',border:'1px solid rgba(255,255,255,.4)',color:'#fff'}:{background:'var(--brand)',color:'var(--onb)'})}>TA</div>`;
const Logo=({name})=>html`<div className="flex items-center gap-2.5 min-w-0"><${Mark} size="w-10 h-10"/><div className="leading-tight min-w-0"><div className="font-extrabold text-[15px] hd">KASIR TA</div><div className="text-[11px] truncate" style=${{color:'var(--mute)'}}>${name}</div></div></div>`;
const Stat=({l,v,c,s})=>html`<div className="card p-4"><div className="text-xs" style=${{color:'var(--mute)'}}>${l}</div><div className="font-extrabold text-lg mt-1 nums hd truncate" style=${{color:c||'var(--ink)'}}>${v}</div>${s&&html`<div className="text-[11px] mt-0.5" style=${{color:'var(--mute)'}}>${s}</div>`}</div>`;

const readImg=(file,cb,mx=480,ty='image/jpeg')=>{if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(ty,.8))};im.src=r.result};r.readAsDataURL(file)};
const Pic=({p,cls,st})=>p.img?html`<img src=${p.img} alt=${p.name} className=${'object-cover rounded-2xl '+cls} style=${st}/>`:html`<div className=${'rounded-2xl grid place-items-center '+cls} style=${{background:'var(--soft)',...st}}>${p.icon}</div>`;
const Credit=({big})=>html`<div className=${'cr text-center '+(big?'py-5':'py-1')}><div className="cr-sub">Crafted by</div><div className=${'cr-name hd font-extrabold '+(big?'text-xl':'text-[13px]')}>Reksi Hadi Eka Mandara</div><div className="cr-line"></div><div className="cr-copy">\u00a9 ${new Date().getFullYear()} RXdigital \u00b7 Hak cipta dilindungi</div></div>`;

function Kasir({products,cart,setCart,onPay,cfg}){
  const [q,setQ]=useState('');const [cat,setCat]=useState('Semua');const [open,setOpen]=useState(false);const [disc,setDisc]=useState('');
  useBack(open,()=>setOpen(false));
  const cats=['Semua',...new Set(products.map(p=>p.cat))];
  const list=products.filter(p=>(cat==='Semua'||p.cat===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
  const add=p=>{const n=cart[p.id]||0;if(n>=p.stock)return;setCart({...cart,[p.id]:n+1})};
  const dec=id=>{const n={...cart};n[id]>1?n[id]--:delete n[id];setCart(n)};
  const items=products.filter(p=>cart[p.id]);
  const sub=items.reduce((s,p)=>s+p.price*cart[p.id],0),gross=items.reduce((s,p)=>s+(p.price-p.cost)*cart[p.id],0);
  const dsc=Math.min(+disc||0,sub),tax=(sub-dsc)*cfg.tax/100,tot=sub-dsc+tax,count=items.reduce((s,p)=>s+cart[p.id],0);
  const Panel=html`<div className="flex flex-col h-full">
    <div className="flex items-center justify-between p-4 pb-2"><h2 className="font-extrabold text-lg">Pesanan</h2>${count>0&&html`<button className="text-sm font-semibold bg-transparent border-0" style=${{color:'var(--danger)'}} onClick=${()=>{setCart({});setDisc('')}}>Kosongkan</button>`}</div>

function Lap({tx,exp,setExp}){

  const DN=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],dk=x=>new Date(x).toDateString(),now=new Date();
  const data=[6,5,4,3,2,1,0].map(n=>{const dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()-n),k=dt.toDateString();const ts=tx.filter(t=>t.ts&&dk(t.ts)===k);return [n===0?'Hari ini':DN[dt.getDay()],ts.reduce((a,t)=>a+t.tot,0),ts.reduce((a,t)=>a+t.profit,0)]});
  const [sel,setSel]=useState(data.length-1);
  const lo=data[6][1],lp=data[6][2],max=Math.max(1,...data.map(d=>d[1])),pmax=Math.max(1,...data.map(z=>z[2])),d=data[sel];

  const top=Object.values(tm).sort((a,b)=>b[2]-a[2]).slice(0,5);
  const addE=()=>{if(!f.n||!+f.a)return;setExp([{id:Date.now(),n:f.n,a:+f.a},...exp]);setF({n:'',a:''})};
  return html`<div className="px-4 lg:px-6 pt-2 space-y-4 scroll h-full pb-44 lg:pb-6">
    
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <div className="col-span-2 rounded-[28px] p-5 text-white relative overflow-hidden" style=${{background:'linear-gradient(135deg,#08795A 0%,#0FA574 58%,#34D3A0 100%)'}}><div className="text-xs opacity-80">Laba bersih hari ini</div><div className="hd font-extrabold text-3xl mt-1 nums">${rp(net)}</div><div className="inline-block mt-3 text-xs rounded-full px-2.5 py-1" style=${{background:'rgba(255,255,255,.18)'}}>Margin ${(lo?Math.round(lp/lo*100):0)}%</div>

        <svg viewBox=${'0 0 '+W+' '+(H+26)} className="w-full" role="img" aria-label="Grafik omzet dan laba harian">
          ${[0,.5,1].map(x=>html`<line key=${x} x1="0" x2=${W} y1=${H-x*H*.9} y2=${H-x*H*.9} stroke="var(--line)"/>`)}
          ${data.map((r,i)=>{const x=gap+i*(bw+gap),h1=r[1]/max*H*.9,h2=r[2]/max*H*.9;return html`<g key=${i} onClick=${()=>setSel(i)} tabIndex="0" onKeyDown=${e=>e.key==='Enter'&&setSel(i)} style=${{cursor:'pointer'}}>
            <rect x=${x-5} y="0" width=${bw+10} height=${H+26} fill="transparent"/>
            <rect x=${x} y=${H-h1} width=${bw} height=${h1} rx="7" fill=${i===sel?'var(--brand)':'var(--soft)'} opacity=${i===sel?.3:1}/>
            <rect x=${x+8} y=${H-h2} width=${bw-16} height=${h2} rx="5" fill=${i===sel?'var(--brand-d)':'var(--brand)'}/>
            <text x=${x+bw/2} y=${H+21} textAnchor="middle" fontSize="16" fill="var(--mute)">${r[0]}</text></g>`})}
        </svg>
        <div className="flex gap-4 text-xs mt-1" style=${{color:'var(--mute)'}}><span><b style=${{color:'var(--brand)'}}>■</b> Laba</span><span><b style=${{color:'var(--soft)'}}>■</b> Omzet</span></div></div>
      <div className="card p-4"><div className="font-bold mb-3">Penyumbang laba terbesar</div>${top.length===0?html`<p className="text-sm" style=${{color:'var(--mute)'}}>Belum ada penjualan.</p>`:top.map(([n,v,l],i)=>html`<div key=${n} className="mb-3"><div className="flex justify-between text-sm gap-2"><span className="truncate">${n}</span><span className="nums font-semibold shrink-0" style=${{color:'var(--good)'}}>${rp(l)}</span></div><div className="h-2 rounded-full mt-1" style=${{background:'var(--soft)'}}><div className="h-2 rounded-full" style=${{width:(top[0][2]>0?Math.max(0,l/top[0][2]*100):0)+'%',background:i===0?'var(--amber)':'var(--brand)'}}></div></div><div className="text-[11px] mt-0.5" style=${{color:'var(--mute)'}}>${v} terjual</div></div>`)}</div></div>
    <div className="card p-4"><div className="flex justify-between mb-3"><b>Pengeluaran hari ini</b><b className="nums" style=${{color:'var(--danger)'}}>${rp(ex)}</b></div>
      <div className="grid sm:grid-cols-[1fr_160px_auto] gap-2 mb-3"><input className="inp" placeholder="Keperluan (mis. beli gas)" value=${f.n} onChange=${e=>setF({...f,n:e.target.value})}/><input className="inp" type="number" placeholder="Jumlah (Rp)" value=${f.a} onChange=${e=>setF({...f,a:e.target.value})}/><button className="btn" onClick=${addE}>Catat</button></div>
      ${exp.length===0?html`<p className="text-sm" style=${{color:'var(--mute)'}}>Belum ada pengeluaran. Catat biaya seperti listrik, gas, atau belanja bahan agar laba bersih akurat.</p>`:exp.map(e=>html`<div key=${e.id} className="flex items-center justify-between py-2 text-sm" style=${{borderTop:'1px solid var(--line)'}}><span className="truncate">${e.n}</span><span className="flex items-center gap-3"><b className="nums">${rp(e.a)}</b><button aria-label="Hapus" className="bg-transparent border-0 font-semibold" style=${{color:'var(--danger)'}} onClick=${()=>setExp(exp.filter(x=>x.id!==e.id))}>Hapus</button></span></div>`)}</div></div>`;

const Bars=({code})=>{let h=0;for(const c of code)h=(h*31+c.charCodeAt(0))>>>0;const rnd=()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296};let x=0;const r=[];for(let i=0;i<46;i++){const w=1+Math.floor(rnd()*3),g=1+Math.floor(rnd()*2);r.push(html`<rect key=${i} x=${x} y="0" width=${w} height="26" fill="#151B3B"/>`);x+=w+g}return html`<svg viewBox=${'0 0 '+x+' 26'} preserveAspectRatio="none" className="mx-auto" style=${{width:'170px',height:'26px'}} aria-hidden="true">${r}</svg>`};

    const L=[cfg.name,cfg.addr];if(cfg.phone)L.push('Telp/WA: '+cfg.phone);
    L.push(t.no+' \u00b7 '+t.time,'--------------------------------');
    t.items.forEach(i=>L.push(i.name,'  '+i.qty+' x '+rp(i.price)+' = '+rp(i.qty*i.price)));
    L.push('--------------------------------','Subtotal : '+rp(t.sub));
    if(t.disc>0)L.push('Diskon   : -'+rp(t.disc));
    L.push('PPN      : '+rp(t.tax),'TOTAL    : '+rp(t.tot),t.method+' : '+rp(t.paid),'Kembali  : '+rp(t.paid-t.tot),'--------------------------------',cfg.foot,'','KASIR TA \u2014 Sistem Kasir Digital','Powered by RXdigital');
    return L.join('\n');
  };
  const share=async()=>{
    const text=shareText();
    if(isNative()){try{await callNative('share',{text,title:'Struk '+t.no});return}catch(e){}}
    try{if(navigator.share){await navigator.share({title:'Struk '+t.no,text});return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(text);flash('Struk disalin, tinggal tempel')}catch(e){flash('Tidak bisa membagikan')}
  };
  // HTML struk mandiri untuk dicetak (lebar mengikuti kertas: 58mm, 80mm, atau PDF).
  const printHtml=()=>{
    const row=(a,b,bold)=>'<tr'+(bold?' class="b"':'')+'><td>'+esc(a)+'</td><td class="r">'+esc(b)+'</td></tr>';
    let h='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+
      '@page{margin:3mm}*{box-sizing:border-box}body{margin:0 auto;max-width:76mm;font-family:"Courier New",monospace;font-size:12px;color:#000;line-height:1.35}'+
      '.c{text-align:center}.r{text-align:right;white-space:nowrap}.b{font-weight:bold}.big{font-size:15px}table{width:100%;border-collapse:collapse}td{padding:1px 0;vertical-align:top}'+
      'hr{border:0;border-top:1px dashed #000;margin:6px 0}img{width:44px;height:44px;object-fit:contain}</style></head><body>';
    h+='<div class="c">'+(LOGO?'<img src="'+LOGO+'"><br>':'')+'<div class="b big">'+esc(cfg.name)+'</div><div>'+esc(cfg.addr)+'</div>'+(cfg.phone?'<div>Telp/WA: '+esc(cfg.phone)+'</div>':'')+'<div>'+esc(t.no)+' &middot; '+esc(t.time)+'</div></div><hr>';
    h+='<table>';t.items.forEach(i=>{h+='<tr><td colspan="2">'+esc(i.name)+'</td></tr>'+row('  '+i.qty+' x '+rp(i.price),rp(i.qty*i.price))});h+='</table><hr><table>';
    h+=row('Subtotal',rp(t.sub));if(t.disc>0)h+=row('Diskon','-'+rp(t.disc));h+=row('PPN',rp(t.tax))+row('TOTAL',rp(t.tot),true)+row(t.method,rp(t.paid))+row('Kembali',rp(t.paid-t.tot));
    h+='</table><hr><div class="c">'+esc(cfg.foot)+'<br><br><span class="b">KASIR TA</span><br>Sistem Kasir Digital<br>Powered by RXdigital</div></body></html>';
    return h;
  };
  const [busy,setBusy]=useState(false);
  const print=async()=>{
    if(busy)return;
    if(!isNative()){window.print();return}
    setBusy(true);
    try{await callNative('print',{html:printHtml(),name:'Struk '+t.no})}
    catch(e){flash('Gagal mencetak: '+((e&&e.message)||'coba lagi'))}
    finally{setBusy(false)}
  };
  const D=html`<div className="my-3 border-t border-dashed" style=${{borderColor:'#9DA5C8'}}></div>`;
  const R=(a,b,c)=>html`<div className=${'flex justify-between '+(c||'')}><span>${a}</span><span>${b}</span></div>`;
  return html`<div className="fixed inset-0 z-50 grid place-items-center p-4" style=${{background:'rgba(0,0,0,.5)'}} onClick=${onClose}><div className="w-full max-w-sm modal-card" onClick=${e=>e.stopPropagation()}>
    <div id="struk" className="rounded-2xl p-5 text-sm struk-scroll" style=${{background:'#fff',color:'#151B3B',fontFamily:"'Courier New',monospace"}}>
      <div className="text-center">${LOGO&&html`<img src=${LOGO} alt="" className="w-12 h-12 object-contain mx-auto mb-1"/>`}<div className="font-extrabold text-base" style=${{fontFamily:'Sora,sans-serif'}}>${cfg.name}</div><div className="text-xs">${cfg.addr}</div>${cfg.phone&&html`<div className="text-xs">Telp/WA: ${cfg.phone}</div>`}<div className="text-xs mt-1">${t.no} · ${t.time}</div></div>${D}
      ${t.items.map(i=>html`<div key=${i.id} className="mb-1"><div>${i.name}</div>${R(i.qty+' x '+rp(i.price),rp(i.qty*i.price))}</div>`)}${D}
      ${R('Subtotal',rp(t.sub))}${t.disc>0&&R('Diskon','-'+rp(t.disc))}${R('PPN',rp(t.tax))}${R('TOTAL',rp(t.tot),'font-bold text-base')}${R(t.method,rp(t.paid))}${R('Kembali',rp(t.paid-t.tot))}${D}
      <div className="text-center text-xs">${cfg.foot}<div className="mt-4 pt-3 text-center" style=${{borderTop:'1px dashed #B8C0D6'}}>
        <${Bars} code=${t.no}/>
        <div style=${{fontSize:'9px',letterSpacing:'.2em',color:'#7A827F',marginTop:'3px'}}>${t.no}</div>
        <div style=${{fontFamily:'Sora,Inter,sans-serif',fontWeight:800,fontSize:'16px',letterSpacing:'.1em',color:'#151B3B',marginTop:'12px'}}>KASIR TA</div>
        <div style=${{fontFamily:'Inter,system-ui,sans-serif',fontSize:'9px',letterSpacing:'.22em',color:'#4A5350',marginTop:'2px',textTransform:'uppercase'}}>Sistem Kasir Digital</div>
        <div style=${{width:'28px',height:'1.5px',background:'#151B3B',margin:'8px auto'}}></div>
        <div style=${{fontFamily:'Inter,system-ui,sans-serif',fontSize:'9.5px',letterSpacing:'.08em',color:'#7A827F'}}>Powered by</div>
        <div style=${{fontFamily:'Sora,Inter,sans-serif',fontWeight:700,fontSize:'12px',letterSpacing:'.12em',color:'#151B3B',marginTop:'1px'}}>RXdigital</div></div></div></div>
    ${msg&&html`<div className="mt-3 text-center text-xs font-semibold rounded-xl py-2 px-3" style=${{background:'var(--surface)',color:'var(--ink)'}}>${msg}</div>`}
    <div className="grid grid-cols-2 gap-2 mt-3">
      <button className="btn flex items-center justify-center gap-2 disabled:opacity-60" disabled=${busy} onClick=${print}><${Ico} d="M6 9V3h12v6M6 18H4a1 1 0 01-1-1v-6a2 2 0 012-2h14a2 2 0 012 2v6a1 1 0 01-1 1h-2M6 14h12v7H6z" c="w-4 h-4"/>${busy?'Menyiapkan…':'Cetak struk'}</button>
      <button className="flex items-center justify-center gap-2 border-0 font-bold" style=${{background:'#fff',color:'var(--brand-d)',borderRadius:'14px',padding:'.85rem 1.1rem',boxShadow:'inset 0 0 0 1.5px var(--brand)'}} onClick=${share}><${Ico} d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13" c="w-4 h-4"/>Bagikan</button>
      <button className="col-span-2 border-0 font-semibold text-sm py-3" style=${{background:'#fff',color:'#3B4541',borderRadius:'14px'}} onClick=${onClose}>Tutup</button></div></div></div>`;
}

function Bayar({order,onDone,onCancel}){
  const [m,setM]=useState('Tunai');const [paid,setPaid]=useState(order.tot);
  const quick=[order.tot,Math.ceil(order.tot/50000)*50000,100000].filter((v,i,a)=>a.indexOf(v)===i&&v>=order.tot);
  const ok=paid>=order.tot;
  return html`<div className="fixed inset-0 z-50 grid place-items-center p-4" style=${{background:'rgba(0,0,0,.5)'}} onClick=${onCancel}><div className="card w-full max-w-sm p-5 modal-card" onClick=${e=>e.stopPropagation()}>
    <h2 className="font-extrabold text-lg">Pembayaran</h2><div className="text-3xl font-extrabold nums my-2 hd" style=${{color:'var(--brand)'}}>${rp(order.tot)}</div>
    <div className="flex gap-2 my-3">${['Tunai','QRIS','Debit'].map(x=>html`<button key=${x} className=${'chip flex-1 !py-2 '+(m===x?'on':'')} onClick=${()=>{setM(x);if(x!=='Tunai')setPaid(order.tot)}}>${x}</button>`)}</div>
    ${m==='Tunai'?html`<div><label className="text-xs" style=${{color:'var(--mute)'}}>Uang diterima</label><input type="number" value=${paid} onChange=${e=>setPaid(+e.target.value)} className="inp mt-1 nums font-bold"/>
      <div className="flex gap-2 mt-2">${quick.map(v=>html`<button key=${v} className="btn2 text-xs flex-1" onClick=${()=>setPaid(v)}>${rp(v)}</button>`)}</div>
      <div className="flex justify-between mt-3 text-sm"><span style=${{color:'var(--mute)'}}>Kembalian</span><b className="nums" style=${{color:ok?'var(--ink)':'var(--danger)'}}>${ok?rp(paid-order.tot):'Uang kurang '+rp(order.tot-paid)}</b></div></div>`
      :html`<div className="rounded-xl p-4 text-center text-sm" style=${{background:'var(--soft)'}}><div className="text-5xl mb-1">${m==='QRIS'?'▦':'💳'}</div>${m==='QRIS'?'Minta pelanggan memindai kode QRIS, lalu konfirmasi.':'Gesek atau tempel kartu pada mesin EDC, lalu konfirmasi.'}</div>`}
    <div className="flex gap-2 mt-4"><button className="btn2 flex-1" onClick=${onCancel}>Batal</button><button className="btn flex-[2] disabled:opacity-40" disabled=${!ok} onClick=${()=>onDone(m,paid)}>Konfirmasi bayar</button></div></div></div>`;
}

function App(){
  const [page,setPage]=useState('kasir');const [products,setProducts]=useLS('rx_products',SEED);const [cart,setCart]=useState({});
  const [tx,setTx]=useLS('rx_tx',[]);const [exp,setExp]=useLS('rx_exp',[]);const [cfg,setCfg]=useLS('rx_cfg',DEF);
  const [order,setOrder]=useState(null);const [struk,setStruk]=useState(null);const [toast,setToast]=useState('');
  useBack(page!=='kasir',()=>setPage(page==='about'?'set':'kasir'));
  useBack(!!order,()=>setOrder(null));
  useBack(!!struk,()=>setStruk(null));
  useEffect(()=>{cfg.theme?document.documentElement.setAttribute('data-theme',cfg.theme):document.documentElement.removeAttribute('data-theme')},[cfg.theme]);
  const done=(method,paid)=>{
    const t={...order,method,paid,no:'TRX-'+String(1001+tx.length),ts:Date.now(),time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})};
    setProducts(products.map(p=>{const i=order.items.find(x=>x.id===p.id);return i?{...p,stock:p.stock-i.qty}:p}));
    setTx([t,...tx]);setCart({});setOrder(null);setStruk(t);setToast('Pembayaran berhasil');setTimeout(()=>setToast(''),2200);
  };
  LOGO=cfg.logo||DEFAULT_LOGO;
  const [sp,setSp]=useState(0);
  useEffect(()=>{const a=setTimeout(()=>setSp(1),1700),b=setTimeout(()=>setSp(2),2200);return()=>{clearTimeout(a);clearTimeout(b)}},[]);
  const reset=()=>{setProducts(SEED);setTx([]);setExp([]);setCfg(DEF);setCart({});setPage('kasir')};
  const cur=page==='about'?'set':page;
  const TITLE={kasir:'Kasir',lap:'Laporan laba',produk:'Produk',riwayat:'Riwayat',set:'Pengaturan',about:'Tentang'};
  const hr=new Date().getHours(),greet=hr<11?'Selamat pagi':hr<15?'Selamat siang':hr<18?'Selamat sore':'Selamat malam';
  const Page=page==='kasir'?html`<${Kasir} products=${products} cart=${cart} setCart=${setCart} onPay=${setOrder} cfg=${cfg}/>`:page==='lap'?html`<${Lap} tx=${tx} exp=${exp} setExp=${setExp}/>`:page==='produk'?html`<${Produk} products=${products} setProducts=${setProducts}/>`:page==='riwayat'?html`<${Riwayat} tx=${tx} onView=${setStruk}/>`:page==='set'?html`<${Setelan} cfg=${cfg} setCfg=${setCfg} onAbout=${()=>setPage('about')} onReset=${reset}/>`:html`<${Tentang} onBack=${()=>setPage('set')}/>`;
  const navBtn=(on)=>({background:on?'var(--soft)':'transparent',color:on?'var(--brand-d)':'var(--mute)'});
  return html`<div className="h-full flex">
    ${sp<2&&html`<div className="fixed inset-0 z-[100] flex flex-col items-center justify-center px-6 text-center overflow-hidden" style=${{background:'linear-gradient(160deg,#FFFFFF 0%,#F0FAF5 55%,#E2F6EC 100%)',opacity:sp?0:1,transition:'opacity .5s',pointerEvents:sp?'none':'auto','--mute':'#64736C'}}><div className="sp-blob -top-24 -left-24 w-80 h-80" style=${{background:'#8FEAC6',opacity:.75}}></div><div className="sp-blob -bottom-28 -right-24 w-80 h-80" style=${{background:'#9BDDFF',opacity:.7,animationDelay:'-3s'}}></div><div className="sp-blob top-1/2 -right-16 w-52 h-52" style=${{background:'#FFE2A3',opacity:.55,animationDelay:'-5s'}}></div><div className="relative sp-glow"><div className="sp-title">KASIR TA</div></div><div className="relative mt-5 h-[3px] w-16 rounded-full overflow-hidden" style=${{background:'#CDEBDD'}}><div className="h-full rounded-full" style=${{background:'linear-gradient(90deg,#0FA574,#2BCB95)',animation:'ld 1.7s ease-out forwards'}}></div></div><div className="absolute inset-x-0 flex justify-center px-4" style=${{bottom:'calc(28px + env(safe-area-inset-bottom,0px))'}}><${Credit} slim=${true}/></div></div>`}
    <aside className="hidden lg:flex w-[236px] shrink-0 flex-col card m-4 mr-0 p-4 gap-1.5">
      <div className="mb-6 px-1"><${Logo} name=${cfg.name}/></div>
      ${NAV.map(([k,l,d])=>html`<button key=${k} onClick=${()=>setPage(k)} className="flex items-center gap-3 px-3.5 py-3 rounded-2xl text-sm font-semibold text-left border-0" style=${navBtn(cur===k&&page!=='about')}><${Ico} d=${d}/>${l}</button>`)}
      <button onClick=${()=>setPage('about')} className="flex items-center gap-3 px-3.5 py-3 rounded-2xl text-sm font-semibold text-left border-0" style=${navBtn(page==='about')}><${Ico} d="M12 16v-4m0-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>Tentang</button>
      <div className="mt-auto pt-4"><${Credit}/></div></aside>
    <div className="flex-1 min-w-0 flex flex-col">
      <header className="px-4 lg:px-6 pt-4 pb-3 flex items-center gap-3"><div className="lg:hidden shrink-0"><${Mark} size="w-11 h-11"/></div><div className="min-w-0 flex-1"><div className="text-xs truncate" style=${{color:'var(--mute)'}}>${greet}</div><h1 className="hd font-extrabold text-xl lg:text-2xl truncate">${cfg.name}</h1></div><span className="hidden sm:block shrink-0 text-xs font-semibold rounded-full px-3 py-1.5" style=${{background:'var(--soft)',color:'var(--brand-d)'}}>${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</span></header>
      <main className="flex-1 min-h-0">${Page}</main></div>
    <nav className="lg:hidden fixed left-3 right-3 z-30 flex items-center justify-between p-1.5" style=${{bottom:'calc(10px + env(safe-area-inset-bottom,0px))',background:'var(--surface)',borderRadius:'22px',boxShadow:'0 0 0 1px var(--line),0 18px 32px -14px rgba(15,30,25,.38)'}}>${NAV.map(([k,l,d])=>html`<button key=${k} aria-label=${l} onClick=${()=>setPage(k)} className="flex-1 flex flex-col items-center gap-0.5 rounded-2xl py-2 border-0 text-[10.5px] font-semibold" style=${navBtn(cur===k)}><${Ico} d=${d}/>${l}</button>`)}</nav>
    ${order&&html`<${Bayar} order=${order} onDone=${done} onCancel=${()=>setOrder(null)}/>`}
    ${struk&&html`<${Struk} t=${struk} cfg=${cfg} onClose=${()=>setStruk(null)}/>`}
    ${toast&&html`<div className="fixed top-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-xl text-sm font-semibold" style=${{background:'var(--good)',color:'#fff'}}>${toast}</div>`}</div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
